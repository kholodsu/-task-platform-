      radial-gradient(circle at 92% 14%, rgba(107,79,187,0.28), transparent 46%),
      radial-gradient(circle at 20% 92%, rgba(27,148,208,0.30), transparent 44%),
      radial-gradient(circle at 85% 88%, rgba(26,156,111,0.22), transparent 42%),
      linear-gradient(180deg, #eaf3fb 0%, #f3f6fa 55%, #eef1f7 100%);
    background-attachment:fixed; min-height:100%;
  }
  body{ margin:0; font-family:'Janna','Segoe UI', Tahoma, Arial, sans-serif; color:var(--gray-900); min-height:100vh; }
  .app{max-width:1280px; margin:0 auto; padding:0 20px 60px;}

  .topbar{
    background:linear-gradient(120deg, rgba(12,68,104,0.88) 0%, rgba(20,111,163,0.85) 55%, rgba(27,148,208,0.82) 100%);
    backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%);
    color:#fff; padding:26px 24px; border-radius:0 0 var(--radius-lg) var(--radius-lg); margin-bottom:22px;
    box-shadow:var(--shadow-md); border-bottom:1px solid rgba(255,255,255,0.25);
  }
  .topbar-inner{max-width:1280px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-badge{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto; box-shadow:0 4px 10px rgba(0,0,0,0.15); padding:7px;}
  .brand-badge img{width:100%; height:100%; object-fit:contain;}
  .brand-text h1{margin:0; font-size:19px; font-weight:800;}
  .brand-text p{margin:2px 0 0; font-size:12.5px; color:rgba(255,255,255,0.78);}
  .home-link{color:#bfe9fb; font-size:12.5px; font-weight:700; text-decoration:none;}
  .home-link:hover{text-decoration:underline;}

  .dept-nav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .dept-btn{
    padding:11px 20px; border-radius:999px; background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1px solid var(--glass-border);
    font-size:13.5px; font-weight:800; color:var(--gray-700); cursor:pointer; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow);
    transition:all .15s ease;
  }
  .dept-btn:hover{border-color:var(--blue-300);}
  .dept-btn.active{background:linear-gradient(135deg, var(--blue-700), var(--blue-600)); border-color:transparent; color:#fff; box-shadow:0 10px 26px rgba(12,68,104,0.35);}

  .panel-head{margin-bottom:16px;}
  .panel-head h2{margin:0 0 4px; font-size:19px; color:var(--blue-700);}
  .panel-head p{margin:0; font-size:12.5px; color:var(--gray-500);}

  .card{background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border-radius:var(--radius-lg); box-shadow:var(--shadow); border:1px solid var(--glass-border); padding:22px 24px; margin-bottom:22px;}
  .card h3{margin:0 0 14px; font-size:16px; color:var(--blue-700); display:flex; align-items:center; gap:8px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{padding:9px 10px; border-bottom:1px solid rgba(214,221,227,0.4); text-align:center; white-space:nowrap;}
  thead th{background:rgba(238,246,251,0.7); color:var(--blue-700); font-weight:800; position:sticky; top:0;}
  td:first-child, th:first-child{text-align:right; position:sticky; right:0; background:rgba(255,255,255,0.75); font-weight:700; min-width:150px;}
  thead th:first-child{background:rgba(238,246,251,0.85);}
  tbody tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--glass-border);}
  .needed-col{background:rgba(253,241,222,0.55); color:var(--orange);}
  th.needed-col{background:rgba(253,241,222,0.75);}
  .totals-row{background:rgba(238,246,251,0.6); font-weight:800;}
  .totals-row td:first-child{background:rgba(238,246,251,0.75);}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .toolbar select, .toolbar input[type=text]{
    padding:9px 14px; border-radius:12px; border:1px solid var(--glass-border); font-size:13px;
    background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); color:var(--gray-900);
    font-family:inherit; box-shadow:var(--shadow);
  }
  .toolbar input[type=text]{flex:1; min-width:180px;}

  .empty-note{padding:30px 20px; text-align:center; color:var(--gray-500); font-size:13.5px;}
  .empty-note .big{font-size:28px; margin-bottom:8px;}

  .device-count{font-size:12px; color:var(--gray-500); margin-bottom:10px;}

  @media (max-width:760px){
    .card{padding:16px 14px;}
  }
</style>
</head>

  storageBucket: "task-platform-690d3.firebasestorage.app",
  messagingSenderId: "545861396779",
  appId: "1:545861396779:web:8f5753092c527a6b4ffd6e",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let workforceData = null;
let activeDept = 'labs';

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function loadWorkforce(){
  try{
    const doc = await db.collection('platform').doc('main').get();
    const data = doc.exists ? doc.data() : {};
    return data['workforceData_v2'] || null;
  }catch(e){ console.error(e); return null; }
}

function renderDeptNav(){
  const el = document.getElementById('deptNav');
  el.innerHTML = DEPARTMENTS.map(d => `
    <button class="dept-btn ${d.id===activeDept?'active':''}" data-dept="${d.id}">${escapeHtml(d.name)}</button>
  `).join('');
  el.querySelectorAll('.dept-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeDept = btn.dataset.dept; renderDeptNav(); renderDeptContent(); });
  });
}

function renderWorkforceCard(dept){
  if(!workforceData){
    return `<div class="card"><h3>👥 القوى العاملة</h3><div class="empty-note">جارٍ التحميل...</div></div>`;
  }
  const hospitals = workforceData.hospitals;
  const relevantRows = workforceData.rows.filter(r => dept.specialties.includes(r.specialty));
  if(relevantRows.length === 0){
    return `<div class="card"><h3>👥 القوى العاملة</h3><div class="empty-note">لا توجد بيانات قوى عاملة مطابقة لهذا القسم</div></div>`;
  }
  // sum across matched specialty rows per hospital
  const current = hospitals.map((_, i) => relevantRows.reduce((sum, r) => sum + (typeof r.current[i] === 'number' ? r.current[i] : 0), 0));
  const needed = hospitals.map((_, i) => relevantRows.reduce((sum, r) => sum + (typeof r.needed[i] === 'number' ? r.needed[i] : 0), 0));
  const totalCurrent = current.reduce((a,b)=>a+b,0);
  const totalNeeded = needed.reduce((a,b)=>a+b,0);

  let rows = hospitals.map((h, i) => `
    <tr><td>${escapeHtml(h)}</td><td>${current[i]}</td><td class="needed-col">${needed[i]}</td></tr>
  `).join('');
  rows += `<tr class="totals-row"><td>الإجمالي</td><td>${totalCurrent}</td><td class="needed-col">${totalNeeded}</td></tr>`;

  return `
    <div class="card">
      <h3>👥 القوى العاملة — ${relevantRows.map(r=>escapeHtml(r.specialty)).join(' + ')}</h3>
      <div class="table-scroll">
        <table>
          <thead><tr><th>المنشأة</th><th>الحالي</th><th class="needed-col">الاحتياج</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderOfficialWorkforceCard(title, data){
  const rows = data.map(r => `
    <tr>
      <td>${escapeHtml(r.facility)}</td>
      <td>${r.current === null || r.current === undefined ? '—' : r.current}</td>
      <td class="needed-col">${r.need === null || r.need === undefined ? '—' : r.need}</td>
      <td style="text-align:right; white-space:normal; font-size:12px; color:var(--gray-700); max-width:340px;">${escapeHtml(r.notes) || '—'}</td>
    </tr>
  `).join('');
  const totalCurrent = data.reduce((a,r)=>a+(r.current||0),0);
  const totalNeed = data.reduce((a,r)=>a+(r.need||0),0);
  return `
    <div class="card">
      <h3>📋 ${escapeHtml(title)} (توزيع الوظائف، يناير 2026)</h3>
      <div class="table-scroll">
        <table>
          <thead><tr><th>المنشأة</th><th>العدد الحالي</th><th class="needed-col">الاحتياج</th><th>المبررات</th></tr></thead>
          <tbody>${rows}
            <tr class="totals-row"><td>الإجمالي</td><td>${totalCurrent}</td><td class="needed-col">${totalNeed}</td><td></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderNutritionOfficialCard(){
  const rows = NUTRITION_OFFICIAL_WORKFORCE.map(r => `
    <tr${r.uncertain ? ' style="opacity:0.6;"' : ''}>
      <td>${escapeHtml(r.facility)}${r.uncertain ? ' ⚠️' : ''}</td>
      <td>${r.gen_current === null || r.gen_current === undefined ? '—' : r.gen_current}</td>
      <td class="needed-col">${r.gen_need === null || r.gen_need === undefined ? '—' : r.gen_need}</td>
      <td>${r.ther_current === null || r.ther_current === undefined ? '—' : r.ther_current}</td>
      <td class="needed-col">${r.ther_need === null || r.ther_need === undefined ? '—' : r.ther_need}</td>
      <td style="text-align:right; white-space:normal; font-size:12px; color:var(--gray-700); max-width:280px;">${escapeHtml(r.notes) || '—'}</td>
    </tr>
  `).join('');
  return `
    <div class="card">
      <h3>📋 القوى العاملة الرسمية — التغذية (توزيع الوظائف، يناير 2026)</h3>
      <div class="empty-note" style="padding:8px 0 14px; text-align:right; font-size:12px;">⚠️ الصفوف المعلّمة كانت غامضة بالمستند الأصلي — يُنصح بمراجعتها يدويًا</div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>المنشأة</th><th colspan="2">تغذية عامة</th><th colspan="2" class="needed-col">تغذية علاجية</th><th>المبررات</th></tr>
          <tr><th></th><th>الحالي</th><th class="needed-col">الاحتياج</th><th>الحالي</th><th class="needed-col">الاحتياج</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderLabOfficialWorkforceCard(){
  const rows = LABS_OFFICIAL_WORKFORCE.map(r => `
    <tr>
      <td>${escapeHtml(r.facility)}</td>
      <td>${r.current}</td>
      <td class="needed-col">${r.need === null ? '—' : r.need}</td>
      <td style="text-align:right; white-space:normal; font-size:12px; color:var(--gray-700); max-width:340px;">${escapeHtml(r.notes) || '—'}</td>
    </tr>
  `).join('');
  const totalCurrent = LABS_OFFICIAL_WORKFORCE.reduce((a,r)=>a+r.current,0);
  const totalNeed = LABS_OFFICIAL_WORKFORCE.reduce((a,r)=>a+(r.need||0),0);
  return `
    <div class="card">
      <h3>📋 القوى العاملة الرسمية — المختبرات (توزيع الوظائف، يناير 2026)</h3>
      <div class="table-scroll">
        <table>
          <thead><tr><th>المنشأة</th><th>العدد الحالي</th><th class="needed-col">الاحتياج</th><th>المبررات</th></tr></thead>
          <tbody>${rows}
            <tr class="totals-row"><td>الإجمالي</td><td>${totalCurrent}</td><td class="needed-col">${totalNeed}</td><td></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderLabEquipmentCard(){
  const facilities = [...new Set(LAB_EQUIPMENT.map(d => d.facility))].sort();
  const rowsHtml = (filterFacility, q) => {
    q = (q||'').toLowerCase();
    const list = LAB_EQUIPMENT.filter(d =>
      (!filterFacility || d.facility === filterFacility) &&
      (!q || d.name.toLowerCase().includes(q) || d.mfr.toLowerCase().includes(q) || d.pathway.toLowerCase().includes(q))
    );
    return { html: list.map(d => `
      <tr>
        <td>${escapeHtml(d.facility)}</td>
        <td>${escapeHtml(d.pathway)}</td>
        <td>${escapeHtml(d.name)}</td>
        <td>${escapeHtml(d.mfr)}</td>
        <td>${escapeHtml(d.model)}</td>
        <td>${escapeHtml(d.qty)}</td>
        <td>${escapeHtml(d.type)}</td>
        <td>${escapeHtml(d.age)}</td>
      </tr>
    `).join('') || `<tr><td colspan="8"><div class="empty-note">لا توجد نتائج</div></td></tr>`, count: list.length };
  };
  const first = rowsHtml('', '');
  return `
    <div class="card">
      <h3>🔬 أجهزة المختبرات</h3>
      <div class="toolbar">
        <select id="labFacilityFilter">
          <option value="">كل المنشآت</option>
          ${facilities.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join('')}
        </select>
        <input type="text" id="labSearchInput" placeholder="ابحث باسم الجهاز أو الشركة المصنعة...">
      </div>
      <div class="device-count" id="labDeviceCount">${first.count} جهاز</div>
      <div class="table-scroll" style="max-height:520px; overflow-y:auto;">
        <table>
          <thead><tr><th>المنشأة</th><th>الفئة</th><th>الجهاز</th><th>الشركة المصنعة</th><th>الموديل</th><th>العدد</th><th>النوع</th><th>العمر</th></tr></thead>
          <tbody id="labEquipmentBody">${first.html}</tbody>
        </table>
      </div>
    </div>
  `;
}

function wireLabEquipmentFilters(){
  const facilitySel = document.getElementById('labFacilityFilter');
  const searchInput = document.getElementById('labSearchInput');
  if(!facilitySel) return;
  const update = () => {
    const q = searchInput.value.trim().toLowerCase();
    const fac = facilitySel.value;
    const list = LAB_EQUIPMENT.filter(d =>
      (!fac || d.facility === fac) &&
      (!q || d.name.toLowerCase().includes(q) || d.mfr.toLowerCase().includes(q) || d.pathway.toLowerCase().includes(q))
    );
    document.getElementById('labDeviceCount').textContent = list.length + ' جهاز';
    document.getElementById('labEquipmentBody').innerHTML = list.map(d => `
      <tr>
        <td>${escapeHtml(d.facility)}</td>
        <td>${escapeHtml(d.pathway)}</td>
        <td>${escapeHtml(d.name)}</td>
        <td>${escapeHtml(d.mfr)}</td>
        <td>${escapeHtml(d.model)}</td>
        <td>${escapeHtml(d.qty)}</td>
        <td>${escapeHtml(d.type)}</td>
        <td>${escapeHtml(d.age)}</td>
      </tr>
    `).join('') || `<tr><td colspan="8"><div class="empty-note">لا توجد نتائج</div></td></tr>`;
  };
  facilitySel.addEventListener('change', update);
  searchInput.addEventListener('input', update);
}

function renderRadiologyEquipmentCard(){
  const heads = ['المنشأة', ...RADIOLOGY_EQUIPMENT.columns];
  const headHtml = heads.map(h => `<th>${escapeHtml(h)}</th>`).join('');
  const bodyHtml = RADIOLOGY_EQUIPMENT.rows.map(r => `
    <tr>
      <td>${escapeHtml(r.facility)}</td>
      ${r.values.map(v => `<td>${v === null || v === undefined ? '—' : v}</td>`).join('')}
    </tr>
  `).join('');
  return `
    <div class="card">
      <h3>📡 أجهزة الأشعة</h3>
      <div class="table-scroll">
        <table>
          <thead><tr>${headHtml}</tr></thead>
          <tbody>${bodyHtml}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderEquipmentPlaceholder(deptName){
  return `
    <div class="card">
      <h3>🛠️ الأجهزة</h3>
      <div class="empty-note">
        <div class="big">📭</div>
        لم تُرفع بيانات أجهزة ${escapeHtml(deptName)} بعد.
      </div>
    </div>
  `;
}

async function renderDeptContent(){
  const dept = DEPARTMENTS.find(d => d.id === activeDept);
  const el = document.getElementById('deptContent');
  el.innerHTML = `
    <div class="panel-head">
      <h2>${escapeHtml(dept.name)}</h2>
      <p>القوى العاملة${dept.hasEquipment ? ' والأجهزة' : ''} الخاصة بالقسم</p>
    </div>
    ${(dept.id === 'labs' || dept.id === 'radiology' || dept.id === 'nutrition') ? '' : renderWorkforceCard(dept)}
    ${dept.id === 'labs' ? renderLabOfficialWorkforceCard() : ''}
    ${dept.id === 'radiology' ? renderOfficialWorkforceCard('القوى العاملة الرسمية — الأشعة', RADIOLOGY_OFFICIAL_WORKFORCE) : ''}
    ${dept.id === 'nutrition' ? renderNutritionOfficialCard() : ''}
    ${dept.id === 'rehab' ? renderWorkforceCard(dept) + renderOfficialWorkforceCard('القوى العاملة الرسمية — العلاج التنفسي', RESPIRATORY_OFFICIAL_WORKFORCE) : ''}
    ${dept.hasEquipment === 'labs' ? renderLabEquipmentCard() : ''}
    ${dept.hasEquipment === 'radiology' ? renderRadiologyEquipmentCard() : ''}
    ${dept.hasEquipment === 'rehab' ? renderEquipmentPlaceholder(dept.name) : ''}
  `;
  wireLabEquipmentFilters();
}

async function init(){
  renderDeptNav();
  await renderDeptContent();
  workforceData = await loadWorkforce();
  renderDeptContent();
}

init();
</script>
</body>
</html>
