  :root{
    --ink:#0a2540; --ink-soft:#5b6b78; --ink-faint:#8a97a3;
    --blue:#1b94d0; --blue-deep:#0c4468; --blue-pale:#eaf4fa;
    --paper:#faf9f6; --panel:#ffffff; --line:rgba(214,221,227,0.6);
    --green:#1a7a4f; --green-bg:#e7f3ec;
    --amber:#a86a1a; --amber-bg:#f7ecda;
    --red:#a8382a; --red-bg:#f6e6e2;
    --accent:#1b94d0;
    --radius:16px;
    --glass-bg:rgba(255,255,255,0.55);
    --glass-border:rgba(255,255,255,0.7);
    --glass-blur:blur(24px) saturate(180%);
    --shadow:0 8px 32px rgba(20,80,130,0.10), inset 0 1px 0 rgba(255,255,255,0.55);
  }
  *{box-sizing:border-box;}
  html{
    background:
      radial-gradient(circle at 8% 8%, rgba(79,195,240,0.35), transparent 42%),
      radial-gradient(circle at 92% 14%, rgba(107,79,187,0.26), transparent 46%),
      radial-gradient(circle at 20% 92%, rgba(27,148,208,0.30), transparent 44%),
      radial-gradient(circle at 85% 88%, rgba(26,156,111,0.20), transparent 42%),
      linear-gradient(180deg, #eaf3fb 0%, #f3f6fa 55%, #eef1f7 100%);
    background-attachment:fixed; min-height:100%;
  }
  body{
    margin:0; font-family:'Janna','Tahoma',sans-serif; color:var(--ink); min-height:100vh;
  }
  .app{max-width:1180px; margin:0 auto; padding:0 24px 70px;}

  .topbar{
    background:linear-gradient(120deg, rgba(12,68,104,0.88) 0%, rgba(20,111,163,0.85) 55%, rgba(27,148,208,0.82) 100%);
    backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%);
    padding:22px 28px; margin-bottom:0;
    border-bottom:1px solid rgba(255,255,255,0.25);
    box-shadow:0 20px 56px rgba(10,55,90,0.18), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .topbar-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-badge{width:46px; height:46px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; flex:0 0 auto; padding:6px;}
  .brand-badge img{width:100%; height:100%; object-fit:contain;}
  .brand-text h1{margin:0; font-size:17px; font-weight:800; color:#fff; letter-spacing:.2px;}
  .brand-text p{margin:1px 0 0; font-size:11px; color:rgba(255,255,255,0.65);}
  .home-link{color:#9fd4ee; font-size:12px; font-weight:700; text-decoration:none; border-bottom:1px solid rgba(159,212,238,0.4); padding-bottom:1px;}
  .home-link:hover{color:#fff;}

  .dept-nav{display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 26px; align-items:center;}
  .dept-btn{
    padding:11px 20px; border-radius:999px;
    background:rgba(255,255,255,0.45);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,0.7);
    font-size:13px; font-weight:800; color:var(--ink-soft); cursor:pointer; font-family:inherit;
    box-shadow:0 4px 16px rgba(20,80,130,0.08), inset 0 1px 0 rgba(255,255,255,0.8);
    transition:all .18s cubic-bezier(.4,0,.2,1);
  }
  .dept-btn:hover{background:rgba(255,255,255,0.7); transform:translateY(-1px); color:var(--blue-deep);}
  .dept-btn.active{
    background:var(--btn-accent, var(--blue));
    border-color:rgba(255,255,255,0.35); color:#fff;
    box-shadow:0 10px 26px rgba(12,68,104,0.28), inset 0 1px 0 rgba(255,255,255,0.25);
  }

  .panel-head{margin-bottom:22px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .panel-head h2{margin:0 0 5px; font-size:26px; font-weight:800; color:var(--accent); letter-spacing:.2px;}
  .panel-head p{margin:0; font-size:12.5px; color:var(--ink-faint);}

  .card{
    background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-border); border-top:3px solid var(--accent);
    border-radius:var(--radius); padding:22px 24px; margin-bottom:20px; box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 16px; font-size:14.5px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--line);}

  .icon-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:9px; font-size:16px; flex:0 0 auto;
    background:var(--blue-pale);
  }
  .icon-badge.badge-blue{background:#eaf4fa;}
  .icon-badge.badge-teal{background:#e3f4f1;}
  .icon-badge.badge-navy{background:#e7ecf2;}
  .icon-badge.badge-gold{background:#fbf1de;}
  .icon-badge.badge-mint{background:#e9f6ec;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th, td{padding:9px 10px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap;}
  thead th{background:rgba(234,244,250,0.85); color:var(--blue-deep); font-weight:800; position:sticky; top:0; font-size:11.5px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
  td:first-child, th:first-child{text-align:right; position:sticky; right:0; background:rgba(255,255,255,0.8); font-weight:700; min-width:150px;}
  thead th:first-child{background:var(--blue-pale);}
  tbody tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto; border:1px solid var(--glass-border); border-radius:12px; background:rgba(255,255,255,0.35);}
  .needed-col{background:var(--amber-bg); color:var(--amber);}
  th.needed-col{background:var(--amber-bg);}
  .totals-row{background:var(--blue-pale); font-weight:800;}
  .totals-row td:first-child{background:var(--blue-pale);}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .toolbar select, .toolbar input[type=text]{
    padding:9px 14px; border-radius:12px; border:1px solid var(--glass-border); font-size:13px;
    background:rgba(255,255,255,0.55); backdrop-filter:blur(16px) saturate(180%); -webkit-backdrop-filter:blur(16px) saturate(180%);
    color:var(--ink); font-family:inherit;
    box-shadow:0 3px 12px rgba(20,80,130,0.06), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .toolbar input[type=text]{flex:1; min-width:180px;}

  .empty-note{padding:30px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px;}
  .empty-note .big{font-size:28px; margin-bottom:8px;}

  .device-count{font-size:12px; color:var(--ink-faint); margin-bottom:10px;}

  .highlight-grid-vertical{display:flex; flex-direction:column; gap:10px;}
  .highlight-grid-horizontal{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:12px;}
  .highlight-item{
    background:rgba(255,255,255,0.5); backdrop-filter:blur(18px) saturate(180%); -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid var(--glass-border); border-radius:14px; padding:16px 18px;
    border-right:3px solid var(--accent); transition:all .18s cubic-bezier(.4,0,.2,1);
    box-shadow:0 4px 16px rgba(20,80,130,0.07), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .highlight-item h4{margin:0 0 7px; font-size:13.5px; color:var(--ink); font-weight:800;}
  .highlight-item p{margin:0; font-size:12px; color:var(--ink-soft); line-height:1.65;}
  .mini-table-wrap{margin-top:12px; overflow-x:auto; border:1px solid var(--glass-border); border-radius:10px; background:rgba(255,255,255,0.4);}
  .mini-table-wrap table{font-size:11.5px;}
  .region-total-badge{display:inline-flex; align-items:center; gap:6px; background:var(--blue-pale); color:var(--blue-deep); font-weight:800; padding:6px 14px; border-radius:8px; font-size:13px; margin-right:8px;}

  /* bar chart */
  .bar-chart-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .bar-label{width:200px; flex:0 0 auto; font-size:12.5px; font-weight:700; text-align:right; color:var(--ink);}
  .bar-track{flex:1; height:22px; background:var(--blue-pale); border-radius:5px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:5px; display:flex; align-items:center; justify-content:flex-end; padding-inline-end:10px; min-width:32px;}
  .bar-value{font-size:11.5px; font-weight:800; color:#fff;}
  .bar-share{width:38px; flex:0 0 auto; font-size:11px; color:var(--ink-faint); text-align:left;}

  /* settlements dashboard heatmap */
  .settlements-table th, .settlements-table td{text-align:center; padding:8px 10px;}
  .settlements-table td.status-done{background:var(--green-bg); color:var(--green); font-weight:900; font-size:13px;}
  .settlements-table td.status-pending{background:var(--red-bg); color:var(--red); font-weight:900; font-size:13px;}
  .settlements-table td.status-empty{color:var(--line);}
  .status-dot{display:inline-block; width:9px; height:9px; border-radius:50%;}
  .status-dot.status-done{background:var(--green);}
  .status-dot.status-pending{background:var(--red);}

  /* org chart */
  .org-chart{display:flex; flex-direction:column; align-items:center; padding:6px 0;}
  .org-level{display:flex; justify-content:center; width:100%;}
  .org-box{background:var(--ink); color:#fff; padding:11px 20px; border-radius:10px; font-size:12.5px; font-weight:700; text-align:center; max-width:420px;}
  .org-box.org-mid{background:var(--accent);}
  .org-connector{width:1px; height:20px; background:var(--line);}
  .org-connector-wide{width:80%; max-width:900px; height:1px; background:var(--line); margin-bottom:0;}
  .org-leaves{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; width:100%; margin-top:20px;}
  .org-box.org-leaf{
    background:rgba(255,255,255,0.55); backdrop-filter:blur(16px) saturate(180%); -webkit-backdrop-filter:blur(16px) saturate(180%);
    color:var(--ink); border:1px solid var(--glass-border); border-top:2px solid var(--accent); max-width:none;
    box-shadow:0 3px 12px rgba(20,80,130,0.06), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .org-name{font-weight:800; color:var(--ink); font-size:12.5px;}
  .org-role{font-size:11px; color:var(--ink-faint); margin-top:2px; font-weight:500;}

  /* ---------- detailed workforce cards ---------- */
  .wfd-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(330px,1fr)); gap:14px;}

  .mwn-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:14px;}
  .mwn-card{background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
  .mwn-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .mwn-fac{font-size:13.5px; font-weight:900; color:var(--blue-deep);}
  .mwn-occ{font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; background:var(--blue-pale); color:var(--blue-deep); white-space:nowrap;}
  .mwn-spec-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-top:1px solid rgba(214,221,227,0.5);}
  .mwn-spec-row:first-of-type{border-top:none;}
  .mwn-spec-name{font-size:12px; color:var(--ink); font-weight:700;}
  .mwn-spec-nums{font-size:11px; display:flex; gap:6px; align-items:center;}
  .mwn-badge{padding:2px 8px; border-radius:999px; font-weight:800;}
  .mwn-badge-ok{background:var(--green-bg); color:var(--green);}
  .mwn-badge-gap{background:var(--red-bg); color:var(--red);}
  .wf-chips{display:flex; gap:8px;}
  .wf-chip{font-size:12px; font-weight:800; padding:6px 12px; border-radius:999px; white-space:nowrap;}
  .wf-chip-cur{background:var(--blue-pale); color:var(--blue-deep);}
  .wf-chip-ok{background:var(--green-bg); color:var(--green);}
  .wfd-card{
    background:rgba(255,255,255,0.55); backdrop-filter:blur(18px) saturate(180%); -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid var(--glass-border); border-radius:14px; padding:16px 18px;
    box-shadow:0 4px 16px rgba(20,80,130,0.06), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .wfd-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line);}
  .wfd-fac{font-size:13.5px; font-weight:800; color:var(--ink); line-height:1.4;}
  .wfd-total{
    flex:0 0 auto; min-width:38px; height:38px; padding:0 10px; border-radius:11px;
    background:var(--accent); color:#fff; font-size:16px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
  }
  .wfd-group{margin-bottom:10px;}
  .wfd-group:last-of-type{margin-bottom:0;}
  .wfd-group-name{font-size:10.5px; font-weight:800; color:var(--ink-faint); margin-bottom:5px;}
  .wfd-roles{display:flex; flex-wrap:wrap; gap:6px;}
  .wfd-role{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--blue-pale); color:var(--ink); border-radius:999px;
    padding:5px 11px; font-size:11.5px; font-weight:700;
  }
  .wfd-role b{color:var(--accent); font-size:12.5px; font-weight:900;}
  .wfd-role.wfd-role-transfer{background:#fdf3d0; color:#8a6d00;}
  .wfd-role.wfd-role-transfer b{color:#8a6d00;}
  .wfd-role.wfd-role-admin{background:#e3f0fb; color:#0c5c8a;}
  .wfd-role.wfd-role-admin b{color:#0c5c8a;}
  .wfd-metas{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; padding-top:10px; border-top:1px dashed var(--line);}
  .wfd-meta{font-size:10.5px; font-weight:700; color:var(--amber); background:var(--amber-bg); padding:4px 10px; border-radius:999px;}
  .wfd-empty{font-size:11.5px; color:var(--ink-faint);}

  /* ---------- field visits ---------- */
  .vs-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:14px;}
  .vs-tile{
    background:rgba(255,255,255,0.55); backdrop-filter:blur(18px) saturate(180%); -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid var(--glass-border); border-radius:16px; padding:18px 20px; cursor:pointer;
    border-top:3px solid var(--accent);
    box-shadow:0 4px 16px rgba(20,80,130,0.07), inset 0 1px 0 rgba(255,255,255,0.7);
    transition:all .2s cubic-bezier(.4,0,.2,1);
  }
  .vs-tile:hover{transform:translateY(-3px); box-shadow:0 12px 30px rgba(20,80,130,0.14);}
  .vs-tile.pj-open{background:var(--accent); border-color:var(--accent); transform:translateY(-3px); box-shadow:0 14px 34px rgba(20,80,130,0.28);}
  .vs-tile.pj-open .vs-fac, .vs-tile.pj-open .vs-sum, .vs-tile.pj-open .pj-more, .vs-tile.pj-open .vs-date{color:#fff;}
  .vs-tile.pj-open .vs-pct{background:rgba(255,255,255,0.25); color:#fff;}
  .vs-tile-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .vs-pct{background:var(--green-bg); color:var(--green); font-size:14px; font-weight:900; padding:5px 13px; border-radius:999px;}
  .vs-date{font-size:11px; font-weight:700; color:var(--ink-faint);}
  .vs-fac{font-size:14.5px; font-weight:800; color:var(--ink); margin-bottom:6px; line-height:1.4;}
  .vs-sum{font-size:12px; color:var(--ink-soft); line-height:1.7;}

  .vs-detail{margin-top:20px; padding-top:20px; border-top:2px dashed var(--line);}
  .vs-meter{display:flex; height:14px; border-radius:7px; overflow:hidden; background:rgba(238,241,244,0.8);}
  .vs-meter-fill{height:100%;}
  .vs-meter-fill.vs-ok{background:var(--green);}
  .vs-meter-fill.vs-partial{background:var(--amber);}
  .vs-meter-fill.vs-no{background:var(--red);}
  .vs-legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; font-weight:700; color:var(--ink-soft);}
  .vs-legend span{display:inline-flex; align-items:center; gap:6px;}
  .vs-key{width:11px; height:11px; border-radius:3px; display:inline-block;}
  .vs-key.vs-ok{background:var(--green);} .vs-key.vs-partial{background:var(--amber);} .vs-key.vs-no{background:var(--red);}

  .vs-group{margin-bottom:16px;}
  .vs-group-name{font-size:12px; font-weight:800; color:var(--accent); margin-bottom:8px;}
  .vs-item{display:flex; align-items:flex-start; gap:10px; padding:9px 12px; border-radius:10px; margin-bottom:5px; background:rgba(255,255,255,0.45); border:1px solid var(--glass-border);}
  .vs-dot{flex:0 0 auto; width:9px; height:9px; border-radius:50%; margin-top:5px;}
  .vs-item.vs-ok .vs-dot{background:var(--green);}
  .vs-item.vs-partial .vs-dot{background:var(--amber);}
  .vs-item.vs-no .vs-dot{background:var(--red);}
  .vs-q{flex:1; font-size:12px; font-weight:700; color:var(--ink); line-height:1.6;}
  .vs-a{flex:0 0 auto; max-width:52%; font-size:11.5px; color:var(--ink-soft); text-align:left; line-height:1.6;}
  .vs-item.vs-no .vs-a{color:var(--red); font-weight:700;}
  .vs-item.vs-partial .vs-a{color:var(--amber); font-weight:700;}
  @media (max-width:640px){
    .vs-item{flex-wrap:wrap;}
    .vs-a{max-width:100%; text-align:right; padding-inline-start:19px;}
  }

  /* ---------- department projects ---------- */
  .pj-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:14px;}
  .pj-tile{
    background:rgba(255,255,255,0.55); backdrop-filter:blur(18px) saturate(180%); -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid var(--glass-border); border-radius:16px; padding:18px 20px; cursor:pointer;
    border-top:3px solid var(--accent);
    box-shadow:0 4px 16px rgba(20,80,130,0.07), inset 0 1px 0 rgba(255,255,255,0.7);
    transition:all .2s cubic-bezier(.4,0,.2,1);
  }
  .pj-tile:hover{transform:translateY(-3px); box-shadow:0 12px 30px rgba(20,80,130,0.14);}
  .pj-tile.pj-open{
    background:var(--accent); border-color:var(--accent);
    box-shadow:0 14px 34px rgba(20,80,130,0.28);
    transform:translateY(-3px);
  }
  .pj-tile.pj-open .pj-title,
  .pj-tile.pj-open .pj-tag,
  .pj-tile.pj-open .pj-more{color:#fff;}
  .pj-tile.pj-open .pj-tag{opacity:.9;}
  .pj-tile.pj-open .pj-badge{background:rgba(255,255,255,0.25); color:#fff;}
  .pj-tile.pj-open .pj-more::after{content:" ▴";}
  .pj-tile.pj-open .pj-more{border-top:1px solid rgba(255,255,255,0.3); padding-top:9px;}
  .pj-tile-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .pj-ico{font-size:26px;}
  .pj-badge{font-size:10.5px; font-weight:800; padding:4px 11px; border-radius:999px;}
  .pj-active .pj-badge{background:var(--blue-pale); color:var(--blue-deep);}
  .pj-done .pj-badge{background:var(--green-bg); color:var(--green);}
  .pj-title{font-size:15px; font-weight:800; color:var(--ink); margin-bottom:6px; line-height:1.4;}
  .pj-tag{font-size:12px; color:var(--ink-soft); line-height:1.7;}
  .pj-more{margin-top:12px; font-size:11.5px; font-weight:800; color:var(--accent);}
  .pj-tile:not(.pj-open) .pj-more::after{content:" ▾";}

  .pj-detail{margin-top:20px; padding-top:20px; border-top:2px dashed var(--line);}
  .pj-detail-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-bottom:18px; padding:14px 16px; border-radius:12px; background:var(--accent);}
  .pj-detail-head-title{color:#fff; font-size:14.5px; font-weight:900; display:flex; align-items:center; gap:8px;}
  .pj-detail-close{border:none; background:rgba(255,255,255,0.22); color:#fff; font-size:11.5px; font-weight:800;
    padding:7px 14px; border-radius:8px; cursor:pointer; white-space:nowrap; flex:0 0 auto;}
  .pj-detail-close:hover{background:rgba(255,255,255,0.32);}
  .pj-kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:24px;}
  .pj-kpi{
    background:linear-gradient(135deg, rgba(234,244,250,0.85), rgba(255,255,255,0.6));
    border:1px solid var(--glass-border); border-radius:14px; padding:16px 14px; text-align:center;
  }
  .pj-kpi-v{font-size:20px; font-weight:900; color:var(--accent); line-height:1.2;}
  .pj-kpi-l{font-size:11px; color:var(--ink-soft); margin-top:5px; font-weight:700;}

  .pj-sec{margin-bottom:26px;}
  .pj-sec-head{margin-bottom:14px; padding-inline-start:12px; border-inline-start:3px solid var(--accent);}
  .pj-sec-head h4{margin:0; font-size:14.5px; font-weight:800; color:var(--ink);}
  .pj-sec-head p{margin:3px 0 0; font-size:11.5px; color:var(--ink-faint);}

  .pj-cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:12px;}
  .pj-card{display:flex; gap:12px; background:rgba(255,255,255,0.5); border:1px solid var(--glass-border); border-radius:12px; padding:14px 16px;}
  .pj-card-ico{font-size:20px; flex:0 0 auto;}
  .pj-card-t{font-size:13px; font-weight:800; color:var(--ink); margin-bottom:3px;}
  .pj-card-x{font-size:11.5px; color:var(--ink-soft); line-height:1.6;}

  .pj-excl{background:var(--red-bg); border:1px solid rgba(168,56,42,0.18); border-radius:12px; padding:14px 16px;}
  .pj-excl-row{display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:#7a3520; line-height:1.7; margin-bottom:8px;}
  .pj-excl-row:last-child{margin-bottom:0;}
  .pj-x{flex:0 0 auto; width:18px; height:18px; border-radius:5px; background:#e8664a; color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; margin-top:2px;}

  .pj-out{display:flex; flex-direction:column; gap:9px;}
  .pj-out-row{display:flex; gap:11px; align-items:flex-start; font-size:12.5px; color:var(--ink-soft); line-height:1.7;}
  .pj-n{flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800;}

  .pj-tl{display:flex; flex-direction:column; gap:14px;}
  .pj-tl-row{display:flex; gap:14px; align-items:flex-start;}
  .pj-tl-dot{flex:0 0 auto; width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800;}
  .pj-tl-body{flex:1; background:rgba(255,255,255,0.5); border:1px solid var(--glass-border); border-radius:12px; padding:13px 16px;}
  .pj-tl-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px; flex-wrap:wrap;}
  .pj-tl-t{font-size:13px; font-weight:800; color:var(--ink);}
  .pj-tl-d{font-size:10.5px; font-weight:800; color:var(--accent); background:var(--blue-pale); padding:3px 10px; border-radius:999px;}
  .pj-tl-x{font-size:11.5px; color:var(--ink-soft); line-height:1.7;}

  .pj-cmp{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:14px;}
  .pj-cmp-card{background:rgba(255,255,255,0.5); border:1px solid var(--glass-border); border-radius:14px; padding:16px 18px;}
  .pj-cmp-title{font-size:13px; font-weight:800; color:var(--ink); margin-bottom:14px;}
  .pj-cmp-row{display:flex; align-items:flex-end; gap:12px;}
  .pj-cmp-side{flex:1; min-width:0;}
  .pj-cmp-when{font-size:10.5px; font-weight:700; color:var(--ink-faint); margin-bottom:6px;}
  .pj-cmp-track{height:12px; background:rgba(238,241,244,0.8); border-radius:6px; overflow:hidden;}
  .pj-cmp-bar{height:100%; border-radius:6px;}
  .pj-cmp-before{background:var(--red);}
  .pj-cmp-after{background:var(--green);}
  .pj-cmp-val{margin-top:7px; font-size:14px; font-weight:900;}
  .pj-cmp-val-before{color:var(--red);}
  .pj-cmp-val-after{color:var(--green);}
  .pj-cmp-arrow{flex:0 0 auto; font-size:18px; color:var(--ink-faint); padding-bottom:22px;}

  .pj-facs{display:flex; flex-wrap:wrap; gap:9px;}
  .pj-fac{font-size:12px; font-weight:700; color:var(--ink); background:rgba(255,255,255,0.6); border:1px solid var(--glass-border); padding:8px 14px; border-radius:999px;}

  .pj-footer{margin-top:8px; padding-top:14px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-faint); font-weight:700;}

  .highlight-clickable{cursor:pointer;}
  .highlight-clickable:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(10,37,64,0.10);}
  .highlight-more{margin-top:10px; font-size:11.5px; font-weight:800; color:var(--blue);}

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,37,64,0.45);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:rgba(255,255,255,0.75); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border-radius:20px; width:100%; max-width:560px; max-height:85vh; overflow-y:auto;
    border:1px solid var(--glass-border); box-shadow:0 20px 56px rgba(10,55,90,0.22);
  }
  .modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
  .modal-head h3{margin:0; font-size:15px; color:var(--blue-deep);}
  .modal-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-faint);}
  .modal-body{padding:18px 22px;}

  @media (max-width:760px){
    .card{padding:16px 14px;}
    body{background-size:340px;}
  }
  .gate-overlay{
    position:fixed; inset:0; z-index:99999; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--blue-900) 0%, var(--blue-deep) 55%, var(--blue-600) 100%);
    padding:20px;
  }
  .gate-box{
    width:100%; max-width:380px; text-align:center; padding:36px 30px;
    background:var(--glass-bg-strong); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-border); border-radius:var(--radius-lg); box-shadow:var(--shadow);
  }
  .gate-logo{font-size:40px; line-height:1; margin-bottom:14px;}
  .gate-box h2{margin:0 0 8px; font-size:19px; font-weight:900; color:var(--blue-deep);}
  .gate-box p{margin:0 0 20px; font-size:12.5px; color:var(--gray-700); line-height:1.6;}
  .gate-box input{
    width:100%; box-sizing:border-box; padding:12px 14px; border-radius:12px; border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.8); font-size:14px; font-family:inherit; text-align:center; letter-spacing:2px;
    margin-bottom:12px;
  }
  .gate-box input:focus{outline:none; border-color:var(--blue-500);}
  .gate-box button{
    width:100%; padding:12px; border:none; border-radius:12px; background:var(--blue-500); color:#fff;
    font-size:14px; font-weight:800; font-family:inherit; cursor:pointer;
  }
  .gate-box button:hover{background:var(--blue-600);}
  .gate-error{margin-top:12px; font-size:12px; color:var(--red); font-weight:700; display:none;}
</style>
</head>
<body>
  <div id="gateOverlay" class="gate-overlay">
    <div class="gate-box">
      <div class="gate-logo">🔒</div>
      <h2>الدخول للمنصة</h2>
      <p>هذه المنصة خاصة بفريق إدارة الخدمات الصحية المساندة</p>
      <input type="password" id="gatePassword" placeholder="كلمة المرور" autocomplete="off">
      <button id="gateSubmit" type="button">دخول</button>
      <div id="gateError" class="gate-error">كلمة المرور غير صحيحة</div>
    </div>
  </div>
  <script>
  (function(){
    var PASS = "123098";
    var KEY = "n1cluster_gate_ok";
    var overlay = document.getElementById('gateOverlay');
    function unlock(){
      overlay.style.display = 'none';
      document.documentElement.style.overflow = '';
    }
    try {
      if(localStorage.getItem(KEY) === '1'){ unlock(); return; }
    } catch(e){}
    document.documentElement.style.overflow = 'hidden';
    function tryLogin(){
      var val = document.getElementById('gatePassword').value;
      if(val === PASS){
        try{ localStorage.setItem(KEY, '1'); }catch(e){}
        unlock();
      } else {
        document.getElementById('gateError').style.display = 'block';
      }
    }
    document.getElementById('gateSubmit').addEventListener('click', tryLogin);
    document.getElementById('gatePassword').addEventListener('keydown', function(e){ if(e.key === 'Enter') tryLogin(); });
  })();
  </script>

const DEPARTMENT_HIGHLIGHTS = {"labs": [{"title": "مشروع عينتي", "summary": "ربط مختبرات مراكز الرعاية الصحية الأولية بمختبرات المستشفيات لمركزة الفحوصات وتحسين الخدمات المخبرية المقدمة للمستفيد. اضغط لعرض لوحة مؤشرات عينتي المباشرة على Power BI.", "link": "https://app.powerbi.com/groups/me/reports/95790406-8c3c-4945-9623-f0315fe5e9c3/570e658fdc32ca774e22?clientSideAuth=0&experience=power-bi&redirectedFromSignup=1", "type": "service", "details": "مشروع عينتي هو مبادرة للتحول الرقمي تهدف إلى ربط مراكز الرعاية الصحية الأولية بالمختبرات المرجعية في المستشفيات عبر منصة إلكترونية موحدة لتبادل طلبات التحاليل ونتائجها بشكل مباشر وآمن. يعتمد التشغيل على إنشاء الطلب إلكترونيًا من المركز وفق فحوصات معينة، ثم طباعة بركود للعينة وتتبعها خلال النقل حتى الاستلام بالمختبر المرجعي، وتحليلها واعتماد النتائج وإرسالها إلكترونيًا للمركز دون أي تداول ورقي. أسهم المشروع في توحيد قوائم التحاليل ورفع موثوقية النتائج وتقليل الأخطاء الناتجة عن الإدخال اليدوي أو اختلاف المسميات، بما انعكس على جودة الخدمة وتجربة المستفيد. كما أدى إلى رفع الكفاءة التشغيلية عبر تقليل الوقت والجهد في إجراءات الطلب والتسليم والاستلام، وتحقيق أتمتة الإجراءات وتوثيق مسار العينة بالكامل. وبعد الإطلاق لوحِظ ارتفاع في نسبة الطلبات الإلكترونية، وتحسن سرعة وصول النتائج للمراكز، وزيادة اكتمال بيانات الطلبات والعينات، وتحسن الالتزام بمعايير الجودة بما يتوافق مع مستهدفات رؤية المملكة 2030.", "impact": ["ربط المراكز الصحية الأولية بالمختبرات المرجعية في المستشفيات لتسهيل تبادل طلبات ونتائج الفحوصات المخبرية", "تطبيق قوائم تحليل مخبري موحدة وقياسية في جميع المراكز الصحية الأولية لرفع مستوى الموثوقية والجودة", "تحسين جودة الخدمات المخبرية المقدمة بما يتماشى مع رؤية المملكة العربية السعودية 2030 ويدعم احتياجات المستفيدين", "الاستغناء الكامل عن التعاملات الورقية في طلب التحاليل وإرسال النتائج بين مراكز الرعاية الصحية والمختبرات المرجعية، بما يرفع الكفاءة ويحقق التحول الرقمي"]}, {"title": "تحسين بيئة العمل", "summary": "في مختبر برج الشمال الطبي، ومختبر مستشفى طريف العام، ومختبر مستشفى النساء والولادة بعرعر.", "type": "achievemen let activeDept = 'labs';

function iconBadge(emoji, colorClass){
  return `<span class="icon-badge ${colorClass||''}">${emoji}</span>`;
}

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderDeptNav(){
  const el = document.getElementById('deptNav');
  el.innerHTML = DEPARTMENTS.map(d => `
    <button class="dept-btn ${d.id===activeDept?'active':''}" data-dept="${d.id}" style="--btn-accent:${d.accent}">${d.icon} ${escapeHtml(d.name)}</button>
  `).join('');
  el.querySelectorAll('.dept-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeDept = btn.dataset.dept; renderDeptNav(); renderDeptContent(); });
  });
}

function renderSettlementsDashboard(){
  const d = SETTLEMENTS_DASHBOARD;
  const headHtml = d.months.map(m => `<th>${escapeHtml(m)}</th>`).join('');
  const bodyHtml = d.hospitals.map(h => `
    <tr>
      <td>${escapeHtml(h.name)}</td>
      ${h.statuses.map(s => {
        let cls = 'status-empty', icon = '—';
        if(s === 'تم'){ cls='status-done'; icon='✓'; }
        else if(s === 'لم يتم'){ cls='status-pending'; icon='○'; }
        return `<td class="${cls}">${icon}</td>`;
      }).join('')}
    </tr>
  `).join('');
  return `
    <div class="card">
      <h3>${iconBadge("📅","badge-teal")} لوحة متابعة رفع المستخلصات الشهرية</h3>
      <p style="font-size:12px; color:var(--ink-faint); margin:0 0 14px;">حالة رفع كل منشأة لمستخلصها المالي الشهري للإدارة المالية</p>
      <div style="display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap;">
        <span style="display:flex; align-items:center; gap:6px; font-size:12px;"><span class="status-dot status-done"></span> تم الرفع</span>
        <span style="display:flex; align-items:center; gap:6px; font-size:12px;"><span class="status-dot status-pending"></span> لم يتم بعد</span>
      </div>
      <div class="table-scroll">
        <table class="settlements-table">
          <thead><tr><th>المنشأة</th>${headHtml}</tr></thead>
          <tbody>${bodyHtml}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderOrgChart(deptId, deptName){
  const d = DEPT_ORG_CHARTS[deptId];
  if(!d) return '';
  const chainHtml = d.chain.map((title, i) => `
    <div class="org-level"><div class="org-box ${i < d.chain.length-1 ? 'org-top' : 'org-mid'}">${escapeHtml(title)}</div></div>
    ${i < d.chain.length-1 ? '<div class="org-connector"></div>' : ''}
  `).join('');
  const leavesHtml = d.facilities.map(f => `
    <div class="org-box org-leaf">
      <div class="org-role">🧑‍⚕️ ${escapeHtml(f)}</div>
    </div>
  `).join('');
  return `
    <div class="card">
      <h3>${iconBadge("🏛️","badge-navy")} الهيكل التنظيمي — ${escapeHtml(deptName)}</h3>
      <div class="org-chart">
        ${chainHtml}
        <div class="org-connector org-connector-wide"></div>
        <div class="org-leaves">${leavesHtml}</div>
      </div>
    </div>
  `;
}

function truncateText(str, len){
  if(str.length <= len) return str;
  return str.slice(0, len).trim() + '…';
}

function renderCardItem(deptId, idx, h, icon){
  const moreLabel = h.link ? '🔗 فتح الرابط ←' : (h.pdf ? '📄 فتح التقرير ←' : '📋 عرض التفاصيل ←');
  return `
    <div class="highlight-item highlight-clickable highlight-modal-trigger" data-dept="${escapeHtml(deptId)}" data-idx="${idx}">
      <h4>${icon} ${escapeHtml(h.title)}</h4>
      <p>${escapeHtml(truncateText(h.summary, 90))}</p>
      <div class="highlight-more">${moreLabel}</div>
    </div>
  `;
}

function renderServicesCard(deptId){
  const items = DEPARTMENT_HIGHLIGHTS[deptId];
  if(!items || items.length === 0) return '';
  const serviceIdx = [];
  items.forEach((h, idx) => { if(h.type === 'service') serviceIdx.push(idx); });
  if(serviceIdx.length === 0) return '';
  const cards = serviceIdx.map(idx => renderCardItem(deptId, idx, items[idx], '🔷')).join('');
  return `
    <div class="card">
      <h3>${iconBadge("🧰","badge-teal")} الخدمات</h3>
      <div class="highlight-grid highlight-grid-vertical">${cards}</div>
    </div>
  `;
}

function renderAchievementsCard(deptId){
  const items = DEPARTMENT_HIGHLIGHTS[deptId];
  if(!items || items.length === 0) return '';
  const achIdx = [];
  items.forEach((h, idx) => { if(h.type !== 'service') achIdx.push(idx); });
  if(achIdx.length === 0) return '';
  const cards = achIdx.map(idx => renderCardItem(deptId, idx, items[idx], '⭐')).join('');
  return `
    <div class="card">
      <h3>${iconBadge("🏆","badge-gold")} المنجزات</h3>
      <div class="highlight-grid highlight-grid-horizontal">${cards}</div>
    </div>
  `;
}

function openHighlightModal(deptId, idx){
  const h = DEPARTMENT_HIGHLIGHTS[deptId][idx];
  if(!h) return;
  document.getElementById('highlightModalTitle').textContent = h.title;
  let bodyHtml = `<p style="font-size:13.5px; line-height:1.8; color:var(--ink-soft); margin:0;">${escapeHtml(h.summary)}</p>`;
  if(h.details){
    const paras = Array.isArray(h.details) ? h.details : [h.details];
    bodyHtml += paras.map(p => `<p style="font-size:13px; line-height:1.85; color:var(--ink-soft); margin:14px 0 0;">${escapeHtml(p)}</p>`).join('');
  }
  if(h.breakdown && h.breakdown.length){
    bodyHtml += h.breakdown.map(b => `
      <div style="margin-top:16px; padding-top:14px; border-top:1px dashed var(--glass-border);">
        <div style="font-size:13px; font-weight:800; color:var(--accent); margin-bottom:6px;">📍 ${escapeHtml(b.facility)}</div>
        ${b.before ? `<div style="font-size:12.5px; line-height:1.8; color:var(--ink-soft); margin-bottom:6px;"><b style="color:var(--ink);">سابقًا:</b> ${escapeHtml(b.before)}</div>` : ''}
        ${b.now ? `<div style="font-size:12.5px; line-height:1.8; color:var(--ink-soft);"><b style="color:var(--green, #1a9c6f);">حاليًا:</b> ${escapeHtml(b.now)}</div>` : ''}
      </div>
    `).join('');
  }
  if(h.impact && h.impact.length){
    bodyHtml += `
      <div style="margin-top:18px;">
        <div style="font-size:12.5px; font-weight:800; color:var(--accent); margin-bottom:10px; padding-inline-start:10px; border-inline-start:3px solid var(--accent);">✨ الأثر</div>
        <div class="pj-out">${h.impact.map((x,n) => `<div class="pj-out-row"><span class="pj-n">${n+1}</span><span>${escapeHtml(x)}</span></div>`).join('')}</div>
      </div>
    `;
  }
  if(h.groups && h.groups.length){
    bodyHtml += h.groups.map(g => `
      <div style="margin-top:18px;">
        <div style="font-size:12.5px; font-weight:800; color:var(--accent); margin-bottom:10px; padding-inline-start:10px; border-inline-start:3px solid var(--accent);">${escapeHtml(g.heading)}</div>
        <div class="pj-cards">${g.items.map(i => `
          <div class="pj-card">
            <div class="pj-card-ico">${i.icon}</div>
            <div><div class="pj-card-t">${escapeHtml(i.title)}</div>
            <div class="pj-card-x">${escapeHtml(i.text)}</div></div>
          </div>`).join('')}</div>
      </div>
    `).join('');
  }
  if(h.table){
    bodyHtml += `
      <div class="mini-table-wrap" style="margin-top:16px;">
        <table>
          <thead><tr>${h.table.headers.map(x=>`<th>${escapeHtml(x)}</th>`).join('')}</tr></thead>
          <tbody>${h.table.rows.map(r => `<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
    `;
  }
  if(h.pdf || h.link){
    const href = h.link || h.pdf;
    const label = h.link ? '🔗 فتح الرابط' : '📄 فتح التقرير الأصلي';
    bodyHtml += `
      <div style="margin-top:20px;">
        <a href="${escapeHtml(href)}" target="_blank" rel="noopener" style="display:inline-block; padding:9px 18px; border-radius:10px; background:var(--accent); color:#fff; font-size:12.5px; font-weight:800; text-decoration:none;">${label}</a>
      </div>
    `;
  }
  document.getElementById('highlightModalBody').innerHTML = bodyHtml;
  document.getElementById('highlightModalOverlay').classList.add('open');
}
function closeHighlightModal(){
  document.getElementById('highlightModalOverlay').classList.remove('open');
}

function labRows(list, showFacility){
  return list.map(d => `
    <tr>
      ${showFacility ? `<td>${escapeHtml(d.facility)}</td>` : ''}
      <td>${escapeHtml(d.pathway)}</td>
      <td>${escapeHtml(d.name)}</td>
      <td>${escapeHtml(d.mfr)}</td>
      <td>${escapeHtml(d.model)}</td>
      <td>${escapeHtml(d.qty)}</td>
      <td>${escapeHtml(d.type)}</td>
      <td>${escapeHtml(d.age)}</td>
    </tr>
  `).join('') || `<tr><td colspan="${showFacility ? 8 : 7}"><div class="empty-note">لا توجد نتائج</div></td></tr>`;
}
function labHead(showFacility){
  return `<tr>${showFacility ? '<th>المنشأة</th>' : ''}<th>الفئة</th><th>الجهاز</th><th>الشركة المصنعة</th><th>الموديل</th><th>العدد</th><th>النوع</th><th>العمر</th></tr>`;
}
function labFilter(fac, q){
  q = (q||'').toLowerCase();
  return LAB_EQUIPMENT.filter(d =>
    (!fac || d.facility === fac) &&
    (!q || d.name.toLowerCase().includes(q) || d.mfr.toLowerCase().includes(q) || d.pathway.toLowerCase().includes(q))
  );
}

function renderLabEquipmentCard(){
  const facilities = [...new Set(LAB_EQUIPMENT.map(d => d.facility))].sort();
  const list = labFilter('', '');
  return `
    <div class="card">
      <h3>${iconBadge("🔬","badge-mint")} أجهزة المختبرات</h3>
      <div class="toolbar">
        <select id="labFacilityFilter">
          <option value="">كل المنشآت</option>
          ${facilities.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join('')}
        </select>
        <input type="text" id="labSearchInput" placeholder="ابحث باسم الجهاز أو الشركة المصنعة...">
      </div>
      <div class="device-count" id="labDeviceCount">${list.length} جهاز</div>
      <div class="table-scroll" style="max-height:520px; overflow-y:auto;">
        <table>
          <thead id="labEquipmentHead">${labHead(true)}</thead>
          <tbody id="labEquipmentBody">${labRows(list, true)}</tbody>
        </table>
      </div>
    </div>
  `;
}

function wireLabEquipmentFilters(){
  const facilitySel = document.getElementById('labFacilityFilter');
  const searchInput = document.getElementById('labSearchInput');
  if(!facilitySel) return;
  const update = () => {
    const fac = facilitySel.value;
    const list = labFilter(fac, searchInput.value.trim());
    // once a single facility is picked, repeating its name on every row is noise
    const showFacility = !fac;
    document.getElementById('labDeviceCount').textContent =
      list.length + ' جهاز' + (fac ? ' — ' + fac : '');
    document.getElementById('labEquipmentHead').innerHTML = labHead(showFacility);
    document.getElementById('labEquipmentBody').innerHTML = labRows(list, showFacility);
  };
  facilitySel.addEventListener('change', update);
  searchInput.addEventListener('input', update);
}

/* ---------- Department projects (rich, expandable) ---------- */
function projectSection(sec){
  const head = `<div class="pj-sec-head"><h4>${escapeHtml(sec.heading)}</h4>${sec.note ? `<p>${escapeHtml(sec.note)}</p>` : ''}</div>`;
  let bodyHtml = '';
  if(sec.type === 'cards'){
    bodyHtml = `<div class="pj-cards">${sec.items.map(i => `
      <div class="pj-card">
        <div class="pj-card-ico">${i.icon}</div>
        <div><div class="pj-card-t">${escapeHtml(i.title)}</div>
        <div class="pj-card-x">${escapeHtml(i.text)}</div></div>
      </div>`).join('')}</div>`;
  } else if(sec.type === 'exclusions'){
    bodyHtml = `<div class="pj-excl">${sec.items.map(i => `
      <div class="pj-excl-row"><span class="pj-x">✕</span><span>${escapeHtml(i)}</span></div>`).join('')}</div>`;
  } else if(sec.type === 'outcomes'){
    bodyHtml = `<div class="pj-out">${sec.items.map((i, n) => `
      <div class="pj-out-row"><span class="pj-n">${n+1}</span><span>${escapeHtml(i)}</span></div>`).join('')}</div>`;
  } else if(sec.type === 'timeline'){
    bodyHtml = `<div class="pj-tl">${sec.items.map(i => `
      <div class="pj-tl-row">
        <div class="pj-tl-dot">${escapeHtml(i.n)}</div>
        <div class="pj-tl-body">
          <div class="pj-tl-head"><span class="pj-tl-t">${escapeHtml(i.title)}</span><span class="pj-tl-d">${escapeHtml(i.duration)}</span></div>
          <div class="pj-tl-x">${escapeHtml(i.text)}</div>
        </div>
      </div>`).join('')}</div>`;
  } else if(sec.type === 'comparison'){
    bodyHtml = `<div class="pj-cmp">${sec.items.map(i => {
      // scale both bars against the larger value so the drop is visible at a glance
      const max = Math.max(i.beforeVal, i.afterVal, 0.0001);
      const bPct = (i.beforeVal / max) * 100;
      const aPct = Math.max((i.afterVal / max) * 100, 6);
      return `
        <div class="pj-cmp-card">
          <div class="pj-cmp-title">${escapeHtml(i.label)}</div>
          <div class="pj-cmp-row">
            <div class="pj-cmp-side">
              <div class="pj-cmp-when">${escapeHtml(i.beforeLabel)}</div>
              <div class="pj-cmp-track"><div class="pj-cmp-bar pj-cmp-before" style="width:${bPct}%"></div></div>
              <div class="pj-cmp-val pj-cmp-val-before">${escapeHtml(i.before)}</div>
            </div>
            <div class="pj-cmp-arrow">←</div>
            <div class="pj-cmp-side">
              <div class="pj-cmp-when">${escapeHtml(i.afterLabel)}</div>
              <div class="pj-cmp-track"><div class="pj-cmp-bar pj-cmp-after" style="width:${aPct}%"></div></div>
              <div class="pj-cmp-val pj-cmp-val-after">${escapeHtml(i.after)}</div>
            </div>
          </div>
        </div>`;
    }).join('')}</div>`;
  } else if(sec.type === 'facilities'){
    bodyHtml = `<div class="pj-facs">${sec.items.map(i => `<span class="pj-fac">📍 ${escapeHtml(i)}</span>`).join('')}</div>`;
  }
  return `<div class="pj-sec">${head}${bodyHtml}</div>`;
}

function wireProjectTiles(){
  document.querySelectorAll('.pj-tile').forEach(tile => {
    tile.addEventListener('click', () => {
      const id = tile.dataset.pj;
      const panel = document.getElementById('pjd-' + id);
      const opening = panel.style.display === 'none';
      // only one project open at a time keeps the page readable
      closeAllDetails('pj');
      if(opening){
        panel.style.display = 'block';
        tile.classList.add('pj-open');
        panel.scrollIntoView({behavior:'smooth', block:'start'});
      } else {
        tile.scrollIntoView({behavior:'smooth', block:'center'});
      }
    });
  });
  document.querySelectorAll('[data-close-pj]').forEach(btn => {

      closeAllDetails('pj');
      if(tile) tile.scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
}

function detailedWorkforceCard(deptId){
  const d = WORKFORCE_DETAILED[deptId];
  if(!d) return '';

  // Columns like "علاج طبيعي — اخصائي" carry a group and a role; splitting them lets
  // each facility read as a small grouped summary instead of a 16-column wide table.
  const parsed = d.columns.map(c => {
    const i = c.indexOf('—');
    return i === -1
      ? {group: null, role: c.trim()}
      : {group: c.slice(0, i).trim(), role: c.slice(i + 1).trim()};
  });

  const META = ['متسربين', 'موفدين ومبتعثين', 'متسربين خارج المختبر', 'خارج قسم الأشعة', 'المجموع الكلي', 'المجموع', 'الدعم'];
  const isMeta = i => META.includes(parsed[i].role) || META.includes(d.columns[i]);

  const cards = d.rows.map(r => {
    const groups = {};
    let total = 0;
    parsed.forEach((p, i) => {
      const v = r.values[i];
      if(isMeta(i) || typeof v !== 'number' || v === 0) return;
      const key = p.group || 'الكادر';
      (groups[key] = groups[key] || []).push({role: p.role, value: v});
      total += v;
    });

    const chips = Object.entries(groups).map(([g, items]) => `
      <div class="wfd-group">
        <div class="wfd-group-name">${escapeHtml(g)}</div>
        <div class="wfd-roles">
          ${items.map(it => {
            const cls = it.role === 'متسرب داخل المنشأة' ? ' wfd-role-transfer'
              : it.role === 'إداري' ? ' wfd-role-admin' : '';
            return `<span class="wfd-role${cls}">${escapeHtml(it.role)}<b>${it.value}</b></span>`;
          }).join('')}
        </div>
      </div>`).join('');

    // meta columns (transfers, scholarships, support) get their own muted row
    const metaBits = parsed.map((p, i) => {
      const v = r.values[i];
      if(!isMeta(i) || typeof v !== 'number' || v === 0) return '';
      if(p.role === 'المجموع الكلي' || p.role === 'المجموع') return '';
      return `<span class="wfd-meta">${escapeHtml(p.role)}: ${v}</span>`;
    }).join('');

    const stated = d.totalCol != null ? r.values[d.totalCol] : null;
    const shown = (typeof stated === 'number') ? stated : total;

    return `
      <div class="wfd-card">
        <div class="wfd-head">
          <div class="wfd-fac">${escapeHtml(r.facility)}</div>
          <div class="wfd-total">${shown}</div>
        </div>
        ${chips || '<div class="wfd-empty">لا يوجد كادر مسجّل</div>'}
        ${metaBits ? `<div class="wfd-metas">${metaBits}</div>` : ''}
      </div>`;
  }).join('');

  const grand = d.totalCol != null
    ? d.rows.reduce((a, r) => a + (r.values[d.totalCol] || 0), 0)
    : d.rows.reduce((a, r) => a + parsed.reduce((x, p, i) =>
        x + (!isMeta(i) && typeof r.values[i] === 'number' ? r.values[i] : 0), 0), 0);

  return `
    <div class="card">
      <h3>${iconBadge("📋","badge-blue")} تفصيل القوى العاملة حسب الفئة الوظيفية</h3>
      <div style="margin-bottom:16px;"><span class="region-total-badge">📊 الإجمالي: ${grand}</span></div>
      <div class="wfd-grid">${cards}</div>
    </div>
  `;
}

  wireProjectTiles();
  wireVisitTiles();
  el.querySelectorAll('.highlight-modal-trigger').forEach(card => {
    card.addEventListener('click', () => openHighlightModal(card.dataset.dept, parseInt(card.dataset.idx, 10)));
  });
  el.querySelectorAll('.highlight-clickable:not(.highlight-modal-trigger)').forEach(card => {
    card.addEventListener('click', () => window.open(card.dataset.href, '_blank'));
  });
}

async function init(){
  renderDeptNav();
  await renderDeptContent();
  document.getElementById('highlightModalCloseBtn').addEventListener('click', closeHighlightModal);
  document.getElementById('highlightModalOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'highlightModalOverlay') closeHighlightModal();
  });
}

init();
</script>
</body>
